services:
  mongodb:
    image: mongo:latest
    container_name: akgec_mongodb
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: akgec_redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    restart: unless-stopped

  backend:
    build: .
    container_name: akgec_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      MONGO_URI: mongodb://lovevarshney7002_db_user:9720028781@ac-kgbz3do-shard-00-00.lkyampk.mongodb.net:27017,ac-kgbz3do-shard-00-01.lkyampk.mongodb.net:27017,ac-kgbz3do-shard-00-02.lkyampk.mongodb.net:27017/gdg-quiz-portal?ssl=true&replicaSet=atlas-w0m25z-shard-0&authSource=admin&retryWrites=true&w=majority
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '5000:5000'
    depends_on:
      - mongodb
      - redis
    command: npm start

  nginx:
    image: nginx:alpine
    container_name: akgec_nginx
    ports:
      - '80:80'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongodb_data:
  redis_data:
